<aside
  class="sidebar"
  [class.sidebar--open]="open()"
  [attr.aria-hidden]="open() ? null : 'true'"
  aria-label="Menú principal"
>
  <div class="sidebar__head">
    @if (brand.logoUrl) {
      <img
        class="sidebar__logo"
        [src]="brand.logoUrl"
        [alt]="brand.logoAlt"
        [width]="brand.logoWidth"
        [height]="brand.logoHeight"
      />
    }
    <p class="sidebar__product">{{ brand.productName }}</p>
  </div>

  <nav class="sidebar__nav">
    <ul class="menu">
      @for (item of items; track item.id) {
        <li>
          <button
            type="button"
            class="menu__item"
            [class.menu__item--active]="activeId() === item.id"
            [attr.aria-current]="activeId() === item.id ? 'page' : null"
            (click)="select(item)"
          >
            <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path [attr.d]="item.icon" fill="currentColor" />
            </svg>
            <span>{{ item.label }}</span>
          </button>
        </li>
      }
    </ul>
  </nav>

  <p class="sidebar__foot">{{ brand.organizationName }}</p>
</aside>
