<div class="bell">
  <button
    type="button"
    class="icon-btn bell__trigger"
    aria-controls="notifications-panel"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="triggerLabel()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2m6-6v-5a6 6 0 0 0-5-5.9V4a1 1 0 1 0-2 0v1.1A6 6 0 0 0 6 11v5l-2 2v1h16v-1z"
        fill="currentColor"
      />
    </svg>
    @if (pendingCount()) {
      <span class="bell__badge" aria-hidden="true">{{ badgeText() }}</span>
    }
  </button>

  @if (open()) {
    <section class="panel" id="notifications-panel" aria-labelledby="notifications-title">
      <header class="panel__head">
        <h2 class="panel__title" id="notifications-title">Notificaciones</h2>
        <button
          type="button"
          class="icon-btn panel__settings"
          aria-label="Configuración de notificaciones"
          (click)="openSettings()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10.34 5.1L10.61 2.7L13.39 2.7L13.66 5.1A7.1 7.1 0 0 1 15.71 5.95L17.59 4.44L19.56 6.41L18.05 8.29A7.1 7.1 0 0 1 18.9 10.34L21.3 10.61L21.3 13.39L18.9 13.66A7.1 7.1 0 0 1 18.05 15.71L19.56 17.59L17.59 19.56L15.71 18.05A7.1 7.1 0 0 1 13.66 18.9L13.39 21.3L10.61 21.3L10.34 18.9A7.1 7.1 0 0 1 8.29 18.05L6.41 19.56L4.44 17.59L5.95 15.71A7.1 7.1 0 0 1 5.1 13.66L2.7 13.39L2.7 10.61L5.1 10.34A7.1 7.1 0 0 1 5.95 8.29L4.44 6.41L6.41 4.44L8.29 5.95A7.1 7.1 0 0 1 10.34 5.1Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      @if (items().length) {
        <ul class="panel__list">
          @for (item of items(); track item.id) {
            <li class="note">
              <span class="note__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  @switch (item.kind) {
                    @case ('availability') {
                      <rect x="4" y="4" width="16" height="16" rx="4" />
                      <path d="M10 16.5v-9h3.25a2.75 2.75 0 0 1 0 5.5H10" />
                    }
                    @case ('access') {
                      <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l4-4-4-4M14 12H4" />
                    }
                    @case ('vehicle') {
                      <circle cx="5.5" cy="16.5" r="3" />
                      <circle cx="18.5" cy="16.5" r="3" />
                      <path d="M5.5 16.5h4l2.5-5h3.5l3 5M12 11.5 10.5 8H8M15.5 11.5 14 7.5h2.5" />
                    }
                    @case ('registration') {
                      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                      <path d="M14 3v5h5M9 13h6M9 17h4" />
                    }
                    @default {
                      <circle cx="12" cy="12" r="9" />
                      <path d="M12 11v5M12 8h.01" />
                    }
                  }
                </svg>
              </span>

              <div class="note__body">
                @if (item.link) {
                  <a class="note__title note__link" [routerLink]="linkPath(item.link)" [queryParams]="linkQuery(item.link)" (click)="close()">
                    {{ item.title }}
                  </a>
                } @else {
                  <p class="note__title">{{ item.title }}</p>
                }
                <p class="note__message">{{ item.message }}</p>
                <time class="note__time" [attr.datetime]="item.createdAt.toISOString()">
                  {{ timeAgo(item.createdAt) }}
                </time>
              </div>

              <button
                type="button"
                class="note__dismiss"
                [attr.aria-label]="'Descartar notificación: ' + item.title"
                (click)="dismiss(item)"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M6 6l12 12M18 6 6 18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </li>
          }
        </ul>
      } @else {
        <div class="panel__empty" role="status">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13.7 20a2 2 0 0 1-3.4 0M17.6 13.3V11a5.6 5.6 0 0 0-8.4-4.9M6.6 8.4A5.6 5.6 0 0 0 6.4 10v4l-2 2.5h12.1M3 3l18 18" />
          </svg>
          <p>No tiene notificaciones pendientes</p>
        </div>
      }
    </section>
  }
</div>
